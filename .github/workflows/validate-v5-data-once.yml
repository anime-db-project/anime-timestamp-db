name: Validate schema v5 real data once

on:
  push:
    branches:
      - refactor/anchor-runtime-v5
    paths:
      - ".github/workflows/validate-v5-data-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/anchor-runtime-v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build real-data databases
        run: |
          anime-timestamp-db build \
            --output-dir artifacts \
            --cache-dir .build-cache/timestamp-sources
      - name: Audit generated databases
        run: |
          anime-timestamp-db audit \
            --db artifacts/timestamps.db \
            --evidence-db artifacts/timestamps-evidence.db \
            > artifacts/audit.json
          cat artifacts/audit.json
      - name: Size summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifest = json.loads(Path('artifacts/manifest.json').read_text())
          for name in ('timestamps.db','timestamps.db.zst','timestamps-evidence.db','timestamps-evidence.db.zst'):
              item = manifest['artifacts'][name]
              print(f"{name}\t{item['size_bytes']}\t{item['sha256']}")
          print(json.dumps(manifest.get('identity', {}), sort_keys=True))
          PY
      - name: Upload validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: anime-timestamp-db-v5-validation-${{ github.sha }}
          path: |
            artifacts/timestamps.db
            artifacts/timestamps.db.zst
            artifacts/timestamps-evidence.db
            artifacts/timestamps-evidence.db.zst
            artifacts/manifest.json
            artifacts/audit.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
