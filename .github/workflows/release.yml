name: Tagged database release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: timestamp-db-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -z "$tag" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Skip an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.existing.outputs.exists != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.existing.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Unit tests
        if: steps.existing.outputs.exists != 'true'
        run: python -m unittest discover -s tests -v

      - name: Build real-data databases
        if: steps.existing.outputs.exists != 'true'
        run: |
          anime-timestamp-db build \
            --output-dir artifacts \
            --cache-dir .build-cache/timestamp-sources

      - name: Audit generated databases
        if: steps.existing.outputs.exists != 'true'
        run: |
          anime-timestamp-db audit \
            --db artifacts/timestamps.db \
            --evidence-db artifacts/timestamps-evidence.db \
            > artifacts/audit.json
          cat artifacts/audit.json


      - name: Verify release checksums
        if: steps.existing.outputs.exists != 'true'
        run: cd artifacts && sha256sum --check SHA256SUMS

      - name: Publish database assets
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f -print | sort)
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Anime Timestamp DB release. Runtime/evidence databases, audit data and source notices are published as release assets. GitHub provides the repository Source code (zip) and Source code (tar.gz) archives automatically; this project does not upload duplicate source bundles."

      - name: Existing release
        if: steps.existing.outputs.exists == 'true'
        run: echo "Release ${{ steps.meta.outputs.tag }} already exists; nothing was changed."
