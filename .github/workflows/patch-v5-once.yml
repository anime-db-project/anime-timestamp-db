name: Apply final schema v5 patches once

on:
  push:
    branches:
      - refactor/anchor-runtime-v5
    paths:
      - ".github/workflows/patch-v5-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/anchor-runtime-v5
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Preserve fractional episode numbers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("anime_timestamp_db/database.py")
          text = path.read_text()
          text = text.replace(
              "from anime_timestamp_db.config import SourceSpec\n",
              "from anime_timestamp_db.config import SourceSpec\nfrom anime_timestamp_db.episode_numbers import normalize_episode_number\n",
          )
          text = text.replace(
              "        episode_number: int,\n",
              "        episode_number: int | float | str,\n",
              1,
          )
          text = text.replace(
              "        number_text = str(int(episode_number))\n",
              "        number_text = normalize_episode_number(episode_number)\n",
              1,
          )
          path.write_text(text)

          path = Path("anime_timestamp_db/aniskip_importer.py")
          text = path.read_text().replace(
              "                            episode_number=int(episode_value),\n",
              "                            episode_number=episode_value,\n",
              1,
          )
          path.write_text(text)
          PY
      - run: python -m pip install ruff==0.17.3
      - run: ruff format anime_timestamp_db tests scripts
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime_timestamp_db tests
          git commit -m "Preserve fractional provider episode numbers"
          git push origin HEAD:refactor/anchor-runtime-v5
