name: Format schema v5 refactor once

on:
  push:
    branches:
      - refactor/anchor-runtime-v5
    paths:
      - ".github/workflows/format-v5-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/anchor-runtime-v5
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.3
      - run: ruff format anime_timestamp_db tests scripts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime_timestamp_db tests scripts
          git commit -m "Format schema v5 refactor"
          git push origin HEAD:refactor/anchor-runtime-v5
