name: Cleanup stale branches once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branches=(
            "feat/schema-v5-anchor-native"
            "feat/stable-anchor-ids"
            "fix/release-source-archive-hardening"
            "oat-integration-temp"
            "oat-integration-temp-2"
            "oat-integration-temp-3"
            "oat-integration-temp4"
            "tmp/branch-cleanup"
          )
          for branch in "${branches[@]}"; do
            if gh api "/repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "/repos/$repo/git/refs/heads/$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-stale-branches-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove completed branch cleanup workflow"
          git push origin HEAD:main
