name: Cleanup custom source archive assets once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-source-assets-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete project-generated source archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | .assets[]? | select(.name | test("(^zz-)?anime-timestamp-db-.*-source\\.(zip|7z)$|(^zz-)?anime-timestamp-db-.*-source\\.tar\\.zst$")) | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r asset_id asset_name; do
              echo "Deleting $asset_name ($asset_id)"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
