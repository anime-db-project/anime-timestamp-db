name: Finalize compact v5 documentation once

on:
  push:
    branches:
      - refactor/anchor-runtime-v5
    paths:
      - ".github/workflows/compact-v5-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/anchor-runtime-v5
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Update README and stats test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, count))

          old_table = "| `timestamps.db` | 100,433,920 B | 94,126,080 B | **6.28%** |\n| `timestamps.db.zst` | 29,654,953 B | 27,778,969 B | **6.33%** |\n| `timestamps-evidence.db` | 205,631,488 B | 182,784,000 B | **11.11%** |\n| `timestamps-evidence.db.zst` | 39,729,258 B | 38,235,255 B | **3.76%** |\n| GitHub Actions artifact | 148,320,904 B | 140,511,813 B | **5.26%** |"
          new_table = "| `timestamps.db` | 100,433,920 B | 68,227,072 B | **32.07%** |\n| `timestamps.db.zst` | 29,654,953 B | 19,824,575 B | **33.15%** |\n| `timestamps-evidence.db` | 205,631,488 B | 143,065,088 B | **30.43%** |\n| `timestamps-evidence.db.zst` | 39,729,258 B | 32,056,171 B | **19.31%** |\n| GitHub Actions artifact | 148,320,904 B | 110,099,940 B | **25.77%** |"
          replace("README.md", old_table, new_table)
          replace("README.md", "The main savings come from removing the duplicated title alias layer and repeated mapping metadata. In the validation databases, `title_ids` disappeared completely and the evidence `records` table shrank substantially.\n", "The main savings come from removing the duplicated title alias layer, compacting synthetic AniSkip/SkipDB IDs, storing full evidence SHA-256 digests as 32-byte BLOBs, and removing redundant SQLite indexes whose queries are already covered by episode-first/UNIQUE indexes. `title_ids` disappears completely while runtime lookup plans remain episode-indexed.\n")

          replace("tests/test_episode_index.py", "            self.assertEqual(stats.provider_episode_ids, 3)\n", "            self.assertEqual(stats.provider_episode_ids, 3)\n            self.assertEqual(stats.provider_episode_ids_inserted, 3)\n")
          PY
      - name: Validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff coverage
          ruff format anime_timestamp_db tests scripts
          ruff check anime_timestamp_db tests scripts --select E9,F63,F7,F82
          ruff format --check anime_timestamp_db tests scripts
          python -m unittest discover -s tests -v
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_episode_index.py anime_timestamp_db/episode_index.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Document compact schema v5 results"
          git push origin HEAD:refactor/anchor-runtime-v5
