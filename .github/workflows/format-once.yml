name: One-shot Ruff format

on:
  push:
    branches: [main]
    paths:
      - .github/format-trigger

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Format
        run: |
          python -m pip install ruff==0.17.3
          ruff format anime_timestamp_db tests scripts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime_timestamp_db tests scripts
          git commit -m "Format code with Ruff"
          git push origin HEAD:main
