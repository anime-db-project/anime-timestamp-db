name: Database build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: timestamp-db-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_IMPORT_APPROVED: ${{ vars.ENABLE_API_CRAWL_IMPORT || 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Restore authorized API snapshots for build
        if: env.API_IMPORT_APPROVED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for source in aniskip anime_skip; do
            python scripts/checkpoint_store.py restore --source "$source" --state-dir api-checkpoints
            test -s "api-checkpoints/$source.json.gz"
          done

      - name: Build real-data databases
        shell: bash
        run: |
          flags=()
          if [[ "$API_IMPORT_APPROVED" == "true" ]]; then
            flags+=(--api-checkpoint-dir api-checkpoints --allow-api-redistribution)
          fi
          anime-timestamp-db build \
            --output-dir artifacts \
            --cache-dir .build-cache/timestamp-sources \
            "${flags[@]}"
      - name: Audit generated databases
        run: |
          anime-timestamp-db audit \
            --db artifacts/timestamps.db \
            --evidence-db artifacts/timestamps-evidence.db \
            > artifacts/audit.json
          cat artifacts/audit.json
      - name: Build summary
        run: python scripts/print_build_summary.py artifacts/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload database artifact
        uses: actions/upload-artifact@v7
        with:
          name: anime-timestamp-db-${{ github.sha }}
          path: |
            artifacts/timestamps.db
            artifacts/timestamps.db.zst
            artifacts/timestamps-evidence.db
            artifacts/timestamps-evidence.db.zst
            artifacts/manifest.json
            artifacts/audit.json
            artifacts/SHA256SUMS
            artifacts/DATA_LICENSE.md
            artifacts/THIRD_PARTY_NOTICES.md
            artifacts/ANISKIP_PUBLIC_DATA_NOTICE.md
            artifacts/OPEN_ANIME_TIMESTAMPS_NOTICE.md
            artifacts/SKIPDB_DATA_LICENSE.txt
            artifacts/BAHA_LICENSE.txt
            artifacts/ANIBRIDGE_LICENSE.txt
            artifacts/ANIME_SKIP_API_NOTICE.md
            artifacts/MAPPING_DB_DATA_LICENSE.md
            artifacts/MAPPING_DB_THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
