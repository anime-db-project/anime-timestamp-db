name: Timestamp API crawling

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: HTTP request budget per source per run (1-5000)
        type: string
        required: false
        default: "1000"
      mode:
        description: Maintenance or one-time resumable full bootstrap
        type: choice
        options: [maintenance, bootstrap]
        required: false
        default: maintenance
      remaining_runs:
        description: Bootstrap safety bound including this run (1-160)
        type: string
        required: false
        default: "160"
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/crawl_timestamps.py"
      - "scripts/checkpoint_store.py"
      - "scripts/bootstrap_progress.py"
      - "tests/test_crawler.py"
      - "tests/test_checkpoint_store.py"
      - "tests/test_bootstrap_progress.py"
      - ".github/workflows/crawl.yml"

permissions:
  contents: write
  actions: write

# Never run two checkpoint writers for the same source at the same time.
concurrency:
  group: anime-timestamp-db-api-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: [aniskip, anime_skip]
    env:
      ANIME_SKIP_CLIENT_ID: ${{ secrets.ANIME_SKIP_CLIENT_ID }}
      SOURCE: ${{ matrix.source }}
      REQUEST_LIMIT: ${{ github.event_name == 'push' && '2' || inputs.max_requests || '1000' }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .

      - name: Check credentials and request budget
        id: preflight
        shell: bash
        run: |
          if [[ "$SOURCE" == "anime_skip" && -z "$ANIME_SKIP_CLIENT_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Anime Skip skipped: set Actions secret ANIME_SKIP_CLIENT_ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ ! "$REQUEST_LIMIT" =~ ^[1-9][0-9]{0,3}$ ]] || (( REQUEST_LIMIT > 5000 )); then
            echo "max_requests must be an integer between 1 and 5000" >&2
            exit 1
          fi

      - name: Restore legacy Actions cache (migration fallback)
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/crawler-state/${{ matrix.source }}.json.gz
          key: timestamp-crawler-v1-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            timestamp-crawler-v1-${{ matrix.source }}-

      - name: Restore durable source checkpoint (authoritative)
        if: steps.preflight.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/checkpoint_store.py restore --source "$SOURCE"

      - name: Download read-only mapping reference
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p inputs
          curl -fL --retry 3 --retry-delay 2 \
            -o inputs/mappings.db.zst \
            https://github.com/anime-db-project/anime-mapping-db/releases/latest/download/mappings.db.zst
          python - <<'PY'
          from pathlib import Path
          from anime_timestamp_db.mapping_identity import decompress_mapping_database
          decompress_mapping_database(Path("inputs/mappings.db.zst"), Path("inputs/mappings.db"))
          PY

      - name: Download existing timestamp episode hints
        if: matrix.source == 'aniskip' && steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o inputs/timestamps.db.zst \
            https://github.com/anime-db-project/anime-timestamp-db/releases/latest/download/timestamps.db.zst
          python - <<'PY'
          from pathlib import Path
          import zstandard
          with Path("inputs/timestamps.db.zst").open("rb") as src, Path("inputs/timestamps.db").open("wb") as dst:
              zstandard.ZstdDecompressor().copy_stream(src, dst)
          PY

      - name: Run bounded API crawl
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          hint_args=()
          if [[ "$SOURCE" == "aniskip" ]]; then
            hint_args=(--timestamps-db inputs/timestamps.db)
          fi
          python scripts/crawl_timestamps.py \
            --source "$SOURCE" \
            --mapping-db inputs/mappings.db \
            "${hint_args[@]}" \
            --state-dir .build-cache/crawler-state \
            --output-dir crawler-output \
            --rpm 70 \
            --max-requests "$REQUEST_LIMIT"

      - name: Persist durable checkpoint (also after crawler failure)
        if: always() && steps.preflight.outputs.enabled == 'true' && github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -f ".build-cache/crawler-state/$SOURCE.json.gz" ]]; then
            python scripts/checkpoint_store.py persist --source "$SOURCE"
          else
            echo "No checkpoint to persist."
          fi

      - name: Save cache for fast recovery
        if: always() && steps.preflight.outputs.enabled == 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-cache/crawler-state/${{ matrix.source }}.json.gz
          key: timestamp-crawler-v1-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload reviewable results and recovery checkpoint
        if: always() && steps.preflight.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: timestamp-crawler-${{ matrix.source }}-${{ github.run_id }}
          path: |
            crawler-output/${{ matrix.source }}.jsonl.gz
            crawler-output/${{ matrix.source }}-report.json
            .build-cache/crawler-state/${{ matrix.source }}.json.gz
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Add summary
        if: always() && steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -f "crawler-output/${SOURCE}-report.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(f"crawler-output/{os.environ['SOURCE']}-report.json").read_text())
          print(f"### {report['source']} API crawl")
          for k in ("rpm", "budget", "attempted", "found", "missing", "skipped_upstream_invalid",
                    "observations", "titles", "initial_unchecked_before_run",
                    "initial_unchecked_after_run", "candidate_count_after_run", "due_after_run"):
              print(f"- {k}: {report.get(k)}")
          if report.get("errors"):
              print(f"- fatal errors: {report['errors']}")
          if report.get("warnings"):
              print(f"- upstream warnings: {len(report['warnings'])} (first 5 shown)")
              for item in report["warnings"][:5]:
                  print(f"  - {item['candidate']}: {item['message']}")
          PY
          fi

  bootstrap-next:
    name: Continue initial pass if needed
    needs: crawl
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'bootstrap' &&
      needs.crawl.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download source reports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for source in aniskip anime_skip; do
            mkdir -p "reports/$source"
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "timestamp-crawler-$source-$GITHUB_RUN_ID" \
              --dir "reports/$source"
          done

      - name: Decide whether to continue safely
        id: plan
        env:
          RUNS: ${{ inputs.remaining_runs }}
        run: |
          python scripts/bootstrap_progress.py             --root reports --remaining-runs "$RUNS" >> "$GITHUB_OUTPUT"

      - name: Dispatch next bounded bootstrap batch
        if: steps.plan.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.max_requests }}
          RUNS: ${{ steps.plan.outputs.next_runs }}
        run: |
          gh workflow run crawl.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field "mode=bootstrap" \
            --raw-field "max_requests=${LIMIT:-1000}" \
            --raw-field "remaining_runs=$RUNS"

      - name: Record completion or safety stop
        if: steps.plan.outputs.continue != 'true'
        run: echo "Initial pass complete, or bootstrap safety bound reached. Daily maintenance remains enabled."
